name: Setup
description: Set up Node and restore node_modules from cache, installing only on a miss.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'
        cache: 'yarn'
    - name: Restore node_modules
      id: node-modules
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node22-${{ hashFiles('**/yarn.lock') }}
    # Only runs on a cache miss (first run, or when yarn.lock changes). The
    # `install` job warms this cache; every other job restores it and skips here.
    - name: Install dependencies
      if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: yarn install --frozen-lockfile
